<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Línea</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #111;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body { display: flex; flex-direction: column; }
    #banner {
      display: none;
      background: #111;
      color: #fff;
      text-align: center;
      font-size: 3vh;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.7vh 0;
    }
    #banner.show { display: block; }
    #banner.demo { background: #f08c00; color: #111; }
    #board {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.15fr 0.48fr 0.85fr 0.85fr;
      gap: 8px;
      padding: 8px;
      background: #111;
    }
    .cell {
      background: #fff;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 1vh 1.4vw 0.6vh;
    }
    .label {
      font-size: 3.4vh;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: center;
    }
    .value {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18vh;
      font-weight: 800;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
    }
    .mid .label { font-size: 2.5vh; }
    .mid .value { font-size: 9vh; }
    #cell-gpm, #cell-machine, #cell-paro { grid-column: 1 / -1; }
    #cell-cajas .value, #cell-paros .value, #cell-paro .value { font-size: 12vh; }
    .value.empty, #cell-cajas .value.empty, #cell-paros .value.empty, #cell-paro .value.empty { font-size: 8vh; }
    button.reset {
      font: 700 16px "Segoe UI", Arial, sans-serif;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #111;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }
    button.reset:disabled { opacity: 0.4; cursor: default; }
    #cell-gpm.green { background: #128a2e; color: #fff; }
    #cell-gpm.amber { background: #f08c00; color: #111; }
    #cell-gpm.red { background: #c41212; color: #fff; }
    button.cell {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      width: 100%;
    }
    #cell-machine.working { background: #128a2e; color: #fff; }
    #cell-machine.off { background: #c41212; color: #fff; }
    #board.stale #cell-machine.working,
    #board.stale #cell-machine.off { background: #e4e4e4; color: #3a3a3a; }
    button.cell:disabled { cursor: default; }
    #board.stale .cell { background: #e4e4e4; color: #3a3a3a; }
    #cell-paro,
    #board.stale #cell-paro { background: #c41212; color: #fff; }
    #open-settings {
      position: fixed;
      right: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: 700 14px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }
    #panel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #panel[hidden] { display: none !important; }
    form {
      background: #fff;
      color: #111;
      width: min(520px, 92vw);
      padding: 24px;
      border-radius: 10px;
      display: grid;
      gap: 12px;
    }
    h2 { margin: 0; font-size: 22px; }
    label { display: grid; gap: 4px; font-weight: 700; }
    label.check { display: flex; align-items: center; gap: 8px; }
    input {
      font: 700 22px "Segoe UI", Arial, sans-serif;
      padding: 8px 10px;
    }
    .hint, .note { font-weight: 400; line-height: 1.35; }
    .note { font-size: 14px; color: #333; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    button.primary, button.ghost {
      font: 700 16px "Segoe UI", Arial, sans-serif;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.primary { background: #111; color: #fff; border: 0; }
    button.ghost { background: #fff; border: 1px solid #111; }
    #error { color: #c41212; font-weight: 700; min-height: 1.2em; margin: 0; }
    #saved {
      position: fixed;
      right: 12px;
      bottom: 52px;
      background: #128a2e;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
    }
    #saved[hidden] { display: none !important; }
    #brand {
      flex: none;
      height: 12vh;
      min-height: 64px;
      background: #f4f7f8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8vh 1.4vw;
      gap: 1.4vw;
    }
    #brand img {
      height: 100%;
      width: auto;
      max-width: min(46vw, 520px);
      object-fit: contain;
    }
    @media (max-width: 800px) {
      .mid .value { font-size: 6vh; }
    }
  </style>
</head>
<body>
  <header id="brand">
    <img src="/img/logo.jpeg" alt="CZelaya Ingeniería Eléctrica">
    <img src="/img/logo2.jpeg" alt="Empaques Santo Domingo">
  </header>
  <div id="banner">Sin conexión</div>
  <main id="board" class="stale">
    <section class="cell" id="cell-gpm">
      <div class="label">GPM</div>
      <div class="value empty" id="v-gpm">—</div>
    </section>
    <section class="cell mid" id="cell-machine">
      <div class="label">Máquina</div>
      <div class="value empty" id="v-machine">—</div>
    </section>
    <section class="cell" id="cell-cajas">
      <div class="label">Cajas</div>
      <div class="value empty" id="v-cajas">—</div>
    </section>
    <section class="cell" id="cell-paros">
      <div class="label">Paros</div>
      <div class="value empty" id="v-paros">—</div>
    </section>
    <section class="cell" id="cell-paro">
      <div class="label">Tiempo en paro</div>
      <div class="value empty" id="v-paro">—</div>
    </section>
  </main>
  <button id="open-settings" type="button">Ajustes</button>
  <div id="saved" hidden>Guardado</div>
  <div id="panel" hidden>
    <form id="form">
      <h2>Meta de GPM</h2>
      <label>Verde desde
        <input id="green-at" name="green_at" type="number" min="0" max="100000" required>
      </label>
      <label>Rojo por debajo de
        <input id="red-below" name="red_below" type="number" min="0" max="100000" required>
      </label>
      <p class="hint" id="hint"></p>
      <label class="check"><input id="demo" type="checkbox"> Simular sin PLC</label>
      <p class="note">Muestra un ejemplo. No escribe al PLC.</p>
      <h2>Reset</h2>
      <p class="note">Pulso corto: el bit se pone en 1 y regresa a 0. No se queda activado.</p>
      <button class="reset" id="reset-cajas" type="button" disabled>Reset contador de cajas</button>
      <button class="reset" id="reset-paros" type="button" disabled>Reset cantidad de paros</button>
      <button class="reset" id="reset-tiempo" type="button" disabled>Reset tiempo en paro</button>
      <p id="error"></p>
      <div class="actions">
        <button class="ghost" id="cancel" type="button">Cerrar</button>
        <button class="primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
  <script>
    const board = document.getElementById("board");
    const banner = document.getElementById("banner");
    const gpmCell = document.getElementById("cell-gpm");
    const machineCell = document.getElementById("cell-machine");
    const panel = document.getElementById("panel");
    const form = document.getElementById("form");
    const hint = document.getElementById("hint");
    const error = document.getElementById("error");
    const saved = document.getElementById("saved");
    let latest = null;

    function formatNumber(value) {
      if (value === null || value === undefined) return "—";
      const rounded = Math.round(value);
      const sign = rounded < 0 ? "-" : "";
      return sign + String(Math.abs(rounded)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function formatGpm(value) {
      if (value === null || value === undefined) return "—";
      const number = Number(value);
      const sign = number < 0 ? "-" : "";
      const [whole, frac] = Math.abs(number).toFixed(1).split(".");
      const miles = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return sign + miles + "," + frac;
    }

    function setValue(id, text) {
      const node = document.getElementById(id);
      const empty = text === "—";
      node.textContent = text;
      node.classList.toggle("empty", empty);
    }

    function render(snap) {
      latest = snap;
      const waiting = !snap.plc_online || !snap.has_data;
      banner.classList.toggle("demo", Boolean(snap.demo));
      banner.classList.toggle("show", Boolean(snap.demo) || !snap.plc_online);
      banner.textContent = snap.demo ? "Simulación" : "Sin conexión";
      board.classList.toggle("stale", waiting);
      setValue("v-gpm", formatGpm(snap.gpm));
      setValue("v-cajas", formatNumber(snap.cajas));
      setValue("v-paros", formatNumber(snap.paros));
      setValue("v-paro", formatNumber(snap.tiempo_paro));
      const machineKnown = snap.machine_on === true || snap.machine_on === false;
      const machineText = machineKnown ? (snap.machine_on ? "Encendida" : "Apagada") : "—";
      setValue("v-machine", machineText);
      machineCell.classList.toggle("working", machineKnown && Boolean(snap.machine_on) && !waiting);
      machineCell.classList.toggle("off", machineKnown && !snap.machine_on && !waiting);
      const resetLocked = waiting || Boolean(snap.demo);
      document.querySelectorAll("button.reset").forEach((button) => {
        button.disabled = resetLocked;
      });
      gpmCell.classList.remove("green", "amber", "red");
      if (!waiting && snap.rate_color && snap.rate_color !== "neutral") {
        gpmCell.classList.add(snap.rate_color);
      }
      if (panel.hidden) fillForm(snap);
    }

    function fillForm(snap) {
      document.getElementById("green-at").value = snap.thresholds.green_at;
      document.getElementById("red-below").value = snap.thresholds.red_below;
      document.getElementById("demo").checked = Boolean(snap.demo);
      updateHint();
    }

    function updateHint() {
      const green = Number(document.getElementById("green-at").value);
      const red = Number(document.getElementById("red-below").value);
      if (!(green > red)) {
        hint.textContent = "El verde tiene que ser mayor que el rojo.";
        return;
      }
      hint.textContent = "Desde " + green + " queda en verde. Por debajo de " + red +
        " queda en rojo. De " + red + " a " + (green - 1) + " queda en ámbar.";
    }

    async function loadSnapshot() {
      const response = await fetch("/api/snapshot");
      render(await response.json());
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(protocol + "://" + location.host + "/ws");
      socket.onmessage = (event) => render(JSON.parse(event.data));
      socket.onclose = () => setTimeout(connect, 1000);
    }

    async function sendReset(id) {
      if (!latest || !latest.plc_online || latest.demo) return;
      const response = await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id })
      });
      const payload = await response.json();
      if (!response.ok) {
        error.textContent = payload.detail || "No se pudo escribir el bit.";
        return;
      }
      render(payload);
      saved.textContent = "Reset enviado";
      saved.hidden = false;
      setTimeout(() => { saved.hidden = true; saved.textContent = "Guardado"; }, 1600);
    }
    document.getElementById("reset-cajas").addEventListener("click", () => sendReset("cajas"));
    document.getElementById("reset-paros").addEventListener("click", () => sendReset("paros"));
    document.getElementById("reset-tiempo").addEventListener("click", () => sendReset("tiempo_paro"));
    document.getElementById("open-settings").addEventListener("click", () => {
      if (latest) fillForm(latest);
      error.textContent = "";
      panel.hidden = false;
    });
    document.getElementById("cancel").addEventListener("click", () => {
      panel.hidden = true;
    });
    document.getElementById("green-at").addEventListener("input", updateHint);
    document.getElementById("red-below").addEventListener("input", updateHint);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const body = {
        green_at: Number(document.getElementById("green-at").value),
        red_below: Number(document.getElementById("red-below").value),
        stop_gap_seconds: latest && latest.stop_gap_seconds != null ? latest.stop_gap_seconds : 10,
        demo: document.getElementById("demo").checked,
        show_promedio: false
      };
      const response = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (!response.ok) {
        error.textContent = payload.detail || "No se pudo guardar.";
        return;
      }
      render(payload);
      panel.hidden = true;
      saved.hidden = false;
      setTimeout(() => { saved.hidden = true; }, 1600);
    });

    loadSnapshot().catch(() => {});
    connect();
  </script>
</body>
</html>
